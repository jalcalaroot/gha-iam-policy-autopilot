name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Generate a policy from the fixture plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.16"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: test
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: test
        # Fake credentials - the fixture's provider block skips credential
        # validation, so this never touches a real AWS account.
        run: terraform plan -input=false -out=plan.tfplan

      - name: Terraform show (JSON)
        working-directory: test
        run: terraform show -json plan.tfplan > plan.json

      - name: Run the action against the fixture
        id: autopilot
        uses: ./
        with:
          plan-file: test/plan.json
          region: us-east-1
          account-id: "123456789012"

      - name: Assert the output is non-empty valid JSON with at least one policy
        run: |
          test -s "${{ steps.autopilot.outputs.policy-file }}"
          python3 -c "
          import json
          with open('${{ steps.autopilot.outputs.policy-file }}') as f:
              data = json.load(f)
          assert data.get('Policies'), 'expected at least one generated policy'
          print('OK -', len(data['Policies']), 'policy(ies) generated')
          "
